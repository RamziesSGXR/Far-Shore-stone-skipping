name: Android build

# Builds an installable Android APK on every push to main and attaches it to a
# release tagged "latest", so there is always one download link for the newest build.
# This is a debug build: fine for installing on your own phone, not for the Play Store.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Create the Android project with icons
        run: npm run add:android

      - name: Copy the web app into the Android project
        run: npx cap sync android

      # Every build must be signed with the same key and carry a higher version number,
      # or Android refuses to install it over the copy already on the phone.
      - name: Sign with the fixed test key and number the build
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../keystore/test-builds.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk far-shore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: far-shore-apk
          path: far-shore.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android build
          body: Download far-shore.apk on an Android phone and open it to install. You may need to allow installs from your browser or files app.
          prerelease: true
          files: far-shore.apk
