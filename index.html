<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Far Shore</title>
<style>
:root{
  /* layout: the water fills the screen edge to edge; one round button starts it, one small button in the corner opens sound */
  color-scheme: dark;
  --ink:#f7f2ea;
  --veil:rgba(16,24,44,.34);
  --veil-deep:rgba(16,24,44,.6);
  --veil-line:rgba(247,242,234,.3);
  --night:#0b1026;
  --pad-t:max(16px, env(safe-area-inset-top));
  --pad-r:max(16px, env(safe-area-inset-right));
}
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
body{position:fixed;inset:0}
#lake{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.start{position:fixed;inset:0;display:grid;place-items:center;transition:opacity 1.6s ease}
.start.gone{opacity:0;pointer-events:none}
#start{
  width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:var(--veil);border:1px solid var(--veil-line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 0 0 0 rgba(247,242,234,.25);animation:breathe 3.6s ease-in-out infinite;
}
#start svg{width:34px;height:34px;fill:var(--ink);margin-left:6px}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(247,242,234,.22)}50%{box-shadow:0 0 0 18px rgba(247,242,234,0)}}

.icon-btn{
  position:fixed;top:var(--pad-t);right:var(--pad-r);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--veil);border:1px solid var(--veil-line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.line{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panel{
  position:fixed;top:calc(var(--pad-t) + 58px);right:var(--pad-r);width:min(264px, calc(100vw - 32px));
  padding:16px 18px;border-radius:20px;display:grid;gap:14px;
  background:var(--veil-deep);border:1px solid var(--veil-line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .25s ease, transform .25s ease;
}
.panel.open{opacity:1;pointer-events:auto;transform:none}
.row{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--veil-line)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--veil-line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9.5px;border-radius:50%;background:var(--ink);border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:0}
.row2{display:flex;justify-content:flex-end;gap:10px}
#install[hidden]{display:none}
#restart,#install{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid var(--veil-line);transition:background .2s ease}
#restart.armed{background:rgba(247,242,234,.3)}

/* wordless cues: a fingertip that flicks up from the stone, and one that taps */
.cue{
  position:fixed;left:50%;top:76%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;opacity:0;
  border:1.5px solid rgba(247,242,234,.85);background:rgba(247,242,234,.16);
}
.cue.flick{animation:flick 2.3s ease-in infinite}
.cue.tap{top:44%;animation:tap 1.9s ease-in-out infinite}
@keyframes flick{0%{opacity:0;transform:none}18%{opacity:.9;transform:none}72%{opacity:.5;transform:translateY(-30vh) scale(.8)}86%,100%{opacity:0;transform:translateY(-36vh) scale(.7)}}
@keyframes tap{0%,100%{opacity:0;transform:scale(1.3)}40%{opacity:.85;transform:scale(.8)}62%{opacity:.5;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  .start,.panel{transition:none}
  #start{animation:none}
  .cue.flick,.cue.tap{animation:none;opacity:.55}
}
</style>
</head>
<body>
<canvas id="lake" tabindex="0" aria-label="Water seen from the shore. Hold the stone and flick it to skip it, then tap to hop across the ripples it leaves."></canvas>
<div class="cue" id="cue" aria-hidden="true"></div>
<div class="start" id="startLayer">
  <button id="start" type="button" aria-label="Start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></button>
</div>
<button class="icon-btn" id="audioBtn" type="button" aria-label="Sound settings" aria-expanded="false" aria-controls="audioPanel">
  <svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.6 6.4a7.6 7.6 0 0 1 0 11.2"/></svg>
</button>
<div class="panel" id="audioPanel">
  <label class="row"><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.6 6.4a7.6 7.6 0 0 1 0 11.2"/></svg>
    <input id="volMaster" type="range" min="0" max="100" value="80" aria-label="Overall volume"></label>
  <label class="row"><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5h12c-1.2-1.2-1.8-2.8-1.8-5.2A4.2 4.2 0 0 0 12 7a4.2 4.2 0 0 0-4.2 4.3c0 2.4-.6 4-1.8 5.2z"/><path d="M10.5 19a1.6 1.6 0 0 0 3 0"/><path d="M12 5v2"/></svg>
    <input id="volChime" type="range" min="0" max="100" value="100" aria-label="Chimes and bells"></label>
  <label class="row"><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>
    <input id="volFx" type="range" min="0" max="100" value="100" aria-label="Water, wind and weather"></label>
  <div class="row2">
  <button id="install" type="button" hidden aria-label="Install this app"><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg></button>
  <button id="restart" type="button" aria-label="Start again from the home shore. Press twice."><svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.2-5.1"/><path d="M19 4.5v3.4h-3.4"/></svg></button>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function(){
'use strict';
var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var hintText = '';
function setHint(){}   // the app shows no words; cues are drawn instead

function start(saved){
  var canvas = document.getElementById('lake');
  if(!window.THREE){ document.getElementById('startLayer').style.display = 'none'; setHint('The 3D library did not load. Check your connection and reopen the page.'); return; }
  var renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true}); }
  catch(e){ document.getElementById('startLayer').style.display = 'none'; setHint('This device could not start 3D graphics, so the lake cannot be drawn.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

  var V3 = THREE.Vector3;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(70, 1, 0.08, 3200);
  camera.rotation.order = 'YXZ';
  scene.add(camera);
  scene.fog = new THREE.FogExp2(0xf6c7a6, 0.017);

  /* ---------- palette through the day ---------- */
  function C(h){ return new THREE.Color(h); }
  var KEYS = [
    {deep:C(0x1e3f66),top:C(0x5a6ea6),hor:C(0xf6c7a6),water:C(0x3b5876),mount:C(0x6f739c),sun:C(0xffe2b8),light:.85,star:.10,glit:.9},
    {deep:C(0x0f4a80),top:C(0x4a8fc4),hor:C(0xd3e9ec),water:C(0x2b6d84),mount:C(0x6f9bb0),sun:C(0xfffbea),light:1.0,star:0,glit:.7},
    {deep:C(0x23285c),top:C(0x3b3668),hor:C(0xf29a6c),water:C(0x3a3a63),mount:C(0x54406b),sun:C(0xffb37a),light:.72,star:.2,glit:1.0},
    {deep:C(0x040b22),top:C(0x070b1e),hor:C(0x25335c),water:C(0x0c1730),mount:C(0x121a36),sun:C(0xcfdcff),light:.4,star:1,glit:.55}
  ];
  var P = {deep:C(0),top:C(0),hor:C(0),water:C(0),mount:C(0),sun:C(0),light:1,star:0,glit:1};
  function palette(t){
    t = ((t % 1) + 1) % 1;
    var f = t * 4, i = Math.floor(f) % 4, j = (i + 1) % 4, u = f - Math.floor(f);
    u = u * u * (3 - 2 * u);
    var a = KEYS[i], b = KEYS[j];
    P.top.copy(a.top).lerp(b.top,u); P.hor.copy(a.hor).lerp(b.hor,u);
    P.deep.copy(a.deep).lerp(b.deep,u);
    P.water.copy(a.water).lerp(b.water,u); P.mount.copy(a.mount).lerp(b.mount,u);
    P.sun.copy(a.sun).lerp(b.sun,u);
    P.light = a.light + (b.light - a.light) * u;
    P.star = a.star + (b.star - a.star) * u;
    P.glit = a.glit + (b.glit - a.glit) * u;
  }
  var sunDir = new V3(0,1,0);
  function sunAt(t){
    t = ((t % 1) + 1) % 1;
    var el = t < 0.5 ? Math.sin(Math.PI * t / 0.5) * 0.72 + 0.035
                     : Math.sin(Math.PI * (t - 0.5) / 0.5) * 0.5 + 0.035;
    sunDir.set(-0.32, el, -1).normalize();
  }

  /* ---------- sky (one function, used for the sky and for what the water reflects) ---------- */
  var WX = {storm:{value:0}, bow:{value:0}, aurora:{value:0}, flash:{value:new THREE.Vector4(0, 1, 0, 0)}};
  var SKY_GLSL = [
    'uniform vec3 uTop,uHor,uSun,uSunDir,uMount; uniform float uTime,uNight,uRidge,uStorm,uBow,uAurora; uniform vec4 uFlash;',
    'float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
    'float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
    ' return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y); }',
    'float ridgeH(float a,float s,float H){ return max(H*(0.36+0.30*sin(a*3.0+s*1.7)+0.20*sin(a*7.0+s*3.1)+0.12*sin(a*13.0+s*5.3)+0.06*sin(a*29.0+s*7.9)),H*0.07)*(0.55+1.7*cos(a)*cos(a))*uRidge; }',
    'vec3 skyCol(vec3 d,float withRidge){',
    ' float h = clamp(d.y,0.0,1.0);',
    ' vec3 col = mix(uHor,uTop,pow(h,0.55));',
    ' vec2 cp = d.xz/(d.y+0.18)*1.6 + vec2(uTime*0.008,0.0);',
    ' float c = vnoise(cp)*0.6 + vnoise(cp*2.3+3.1)*0.4;',
    ' c = smoothstep(0.44-0.3*uStorm,0.96-0.3*uStorm,c)*smoothstep(0.02,0.25,d.y);',
    ' vec3 cc = mix(mix(uHor,vec3(1.0),0.35)+uSun*0.12, uHor*0.5, uStorm*0.85);',
    ' col = mix(col, cc, c*(0.5+0.38*uStorm)*(1.0-uNight*0.6));',
    ' float s = max(dot(d,uSunDir),0.0);',
    ' float disc = withRidge>0.5 ? smoothstep(0.994,1.0,s)*0.5 : smoothstep(0.9988,0.9995,s)*0.9;   // on the water the sun is a soft glint, not a hard disc',
    ' col += uSun*(disc + pow(s,220.0)*0.4 + pow(s,10.0)*0.14 + pow(s,3.0)*0.05);',
    ' if(uFlash.w>0.01) col += vec3(0.7,0.78,1.0)*uFlash.w*(0.1+0.9*pow(max(dot(d,uFlash.xyz),0.0),8.0));',
    ' if(uBow>0.01 && d.y>0.0){ float ba = degrees(acos(clamp(dot(d,-uSunDir),-1.0,1.0))); float bt = (ba-39.0)/3.4;',
    '  if(bt>0.0 && bt<1.0) col += (0.5+0.5*cos(6.2832*(bt*0.8+vec3(0.55,0.22,0.9))))*uBow*0.2*sin(bt*3.1416)*smoothstep(0.0,0.14,d.y); }',
    ' if(uAurora>0.01 && d.y>0.03){ float az = atan(d.x,abs(d.z)+0.0001);',
    '  float av = vnoise(vec2(az*5.0+uTime*0.04,1.7)); float cur = vnoise(vec2(az*22.0-uTime*0.07,d.y*3.0));',
    '  float band = smoothstep(0.06,0.16,d.y)*smoothstep(0.62,0.22,d.y);',
    '  col += mix(vec3(0.15,0.95,0.55),vec3(0.55,0.3,0.95),smoothstep(0.15,0.5,d.y))*band*pow(av,1.5)*(0.45+0.55*cur)*uAurora*0.8; }',
    ' if(withRidge>0.5){ float a = atan(d.z,d.x); float el = d.y/(length(d.xz)+0.0001);',
    '  if(el < ridgeH(a,2.3,210.0)/1500.0) col = mix(uMount,uHor,0.74);',
    '  if(el < ridgeH(a,5.1,105.0)/1050.0) col = mix(uMount,uHor,0.5); }',
    ' return col; }'
  ].join('\n');
  var skyU = {uTop:{value:C(0)},uHor:{value:C(0)},uSun:{value:C(0)},uSunDir:{value:sunDir},uMount:{value:C(0)},uTime:{value:0},uNight:{value:0},uRidge:{value:1},uStorm:WX.storm,uBow:WX.bow,uAurora:WX.aurora,uFlash:WX.flash};
  var sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite:false, depthTest:false, fog:false,
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'precision highp float; varying vec3 vD;\n' + SKY_GLSL + '\nvoid main(){ gl_FragColor = vec4(skyCol(normalize(vD),0.0),1.0); }'
  }));
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);

  var starGeo = new THREE.BufferGeometry();
  (function(){
    var n = 520, arr = new Float32Array(n * 3);
    for(var i=0;i<n;i++){
      var a = Math.random() * Math.PI * 2, y = 0.04 + Math.random() * 0.96, r = Math.sqrt(1 - y*y);
      arr[i*3] = Math.cos(a) * r * 1500; arr[i*3+1] = y * 1500; arr[i*3+2] = Math.sin(a) * r * 1500;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  })();
  var starMat = new THREE.PointsMaterial({color:0xffffff,size:1.9,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false,fog:false});
  var stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  scene.add(stars);

  /* ---------- far ridges that never get closer ---------- */
  function ridge(R, H, seed){
    var segs = 260, pos = [], idx = [];
    var s1 = seed*1.7, s2 = seed*3.1, s3 = seed*5.3, s4 = seed*7.9;
    for(var i=0;i<=segs;i++){
      var a = i / segs * Math.PI * 2;
      var h = H * (0.36 + 0.30*Math.sin(a*3+s1) + 0.20*Math.sin(a*7+s2) + 0.12*Math.sin(a*13+s3) + 0.06*Math.sin(a*29+s4));
      h = Math.max(h, H * 0.07) * (0.55 + 1.7 * Math.cos(a) * Math.cos(a));   // high walls to either side, open ahead
      var x = Math.cos(a) * R, z = Math.sin(a) * R;
      pos.push(x, -6, z, x, h, z);
    }
    for(var k=0;k<segs;k++){ var b = k*2; idx.push(b,b+1,b+2, b+1,b+3,b+2); }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({side:THREE.DoubleSide, fog:false}));
    m.frustumCulled = false;
    return m;
  }
  var ridgeFar = ridge(1500, 210, 2.3), ridgeNear = ridge(1050, 105, 5.1);
  scene.add(ridgeFar); scene.add(ridgeNear);

  /* ---------- water ---------- */
  var RN = 16, rip = [], ripI = 0;
  for(var r0=0;r0<RN;r0++) rip.push(new THREE.Vector4(0,0,-100,0));
  /* Wind waves. They run downwind with long crests across the wind, a narrow spread of directions,
     longer waves moving faster (deep-water rule: speed grows with the square root of wavelength),
     crests sharper than troughs, and fine ripples only where a gust is touching the water. */
  var WIND = 0.9, WDX = Math.cos(WIND), WDZ = Math.sin(WIND);
  function r4(v){ return parseFloat(v.toFixed(4)); }
  var WAVES = [[-0.30,6.5,0.40],[-0.12,4.1,0.25],[0.0,2.7,0.17],[0.16,1.8,0.11],[0.34,1.2,0.07]].map(function(w){
    var a = WIND + w[0], k = 6.28318 / w[1];
    return {kx:r4(Math.cos(a) * k), kz:r4(Math.sin(a) * k), om:r4(Math.sqrt(9.81 * k)), w:r4(w[2] * 1.5), fade:r4(0.12 / w[1])};
  });
  function f4(v){ return v.toFixed(4); }
  var WAVE_GLSL = WAVES.map(function(c){
    return ' ph = ' + f4(c.kx) + '*p.x + ' + f4(c.kz) + '*p.y - ' + f4(c.om) + '*uTime; sv = 0.5+0.5*sin(ph);' +
           ' wg += vec2(' + f4(c.kx) + ',' + f4(c.kz) + ')*(' + f4(c.w) + '*sqrt(sv)*cos(ph)*exp(-d*' + f4(c.fade) + '));';
  }).join('\n');
  /* The crossing. CROSS is the distance from the home shore to the far one, in metres.
     Out past the shallows a long swell rolls through: two trains of long waves that lift the
     water, the boats and you as they pass. `sea` is its height, eased toward calm near land and up in a squall. */
  var CROSS = 4000, sea = 0;
  var SW = [{kx:0.041, kz:0.160, om:1.273, w:0.6, ph:0}, {kx:-0.096, kz:0.257, om:1.637, w:0.4, ph:1.7}];
  var SWELL_GLSL_H = SW.map(function(c){ return f4(c.w) + '*sin(' + f4(c.kx) + '*q.x+' + f4(c.kz) + '*q.y-' + f4(c.om) + '*uTime+' + f4(c.ph) + ')'; }).join(' + ');
  var SWELL_GLSL_G = SW.map(function(c){ return f4(c.w) + '*cos(' + f4(c.kx) + '*q.x+' + f4(c.kz) + '*q.y-' + f4(c.om) + '*uTime+' + f4(c.ph) + ')*vec2(' + f4(c.kx) + ',' + f4(c.kz) + ')'; }).join(' + ');
  function swellAt(x, z, t){
    if(sea < 0.001) return 0;
    var h = 0, dx = x - eye.x, dz = z - eye.z;
    for(var i=0;i<SW.length;i++){ var c = SW[i]; h += c.w * Math.sin(c.kx*x + c.kz*z - c.om*t + c.ph); }
    return h * sea * Math.exp(-Math.sqrt(dx*dx + dz*dz) * 0.0015);
  }
  // a disc of water that is fine underfoot and coarse at the horizon
  function seaGeo(){
    var rings = 70, segs = 72, pos = [0, 0, 0], idx = [];
    for(var i=1;i<=rings;i++){ var r = 0.5 * (Math.pow(1.137, i) - 1) + i * 0.25;
      for(var j=0;j<segs;j++){ var a = j / segs * Math.PI * 2; pos.push(Math.cos(a) * r, 0, Math.sin(a) * r); } }
    for(var j2=0;j2<segs;j2++) idx.push(0, 1 + j2, 1 + (j2 + 1) % segs);
    for(var i2=1;i2<rings;i2++) for(var j3=0;j3<segs;j3++){
      var a2 = 1 + (i2 - 1) * segs + j3, b2 = 1 + (i2 - 1) * segs + (j3 + 1) % segs, c2 = a2 + segs, d2 = b2 + segs;
      idx.push(a2, c2, b2, b2, c2, d2);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
    return g;
  }
  var MN = 16, marks = [];
  for(var m1=0;m1<MN;m1++) marks.push(new V3(0, 0, 0));

    ridgeNear.material.color.copy(P.mount).lerp(P.hor, 0.5);
    starMat.opacity = P.star * 0.9;
    hemi.color.copy(P.top).lerp(P.hor, 0.55).lerp(WHITE, 0.3); hemi.groundColor.copy(P.water); hemi.intensity = 0.6 + 0.26 * P.light;
    sunLight.color.copy(P.sun); sunLight.intensity = 0.5 * P.light;
    tmp.copy(sunDir).multiplyScalar(60).add(eye); sunLight.position.copy(tmp); sunLight.target.position.copy(eye);

    // the nearest island you have not stood on yet
    hudT -= dt;
    if(hudT <= 0){
      hudT = 0.5; goal = null;
      var bs = 1e9;
      for(var gi=0;gi<islands.length;gi++){
        var GI = islands[gi]; if(GI.visited || (GI.z - S.pos.z) * S.dir > 4) continue;
        var ex = GI.x - S.pos.x, ez = GI.z - S.pos.z, ed = Math.sqrt(ex*ex + ez*ez);
        var sc2 = ed * (1.7 - 0.7 * Math.cos(angDiff(Math.atan2(-ex, -ez), S.yaw)));
        if(sc2 < bs){ bs = sc2; goal = GI; }
      }
    }
    var shoreP = Math.round(Math.max(0, S.dir > 0 ? S.pos.z - FARC.edge : HOMEC.edge - S.pos.z) / 0.75);
    var nm, ds;
    if(goal){
      var gdx = goal.x - S.pos.x, gdz = goal.z - S.pos.z;
      var paces = Math.round(Math.max(0, Math.sqrt(gdx*gdx + gdz*gdz) - goal.R) / 0.75);
      var rel = angDiff(Math.atan2(-gdx, -gdz), S.yaw + S.look);
      nm = (rel > 0.55 ? '‹ ' : '') + goal.name + (rel < -0.55 ? ' ›' : '');
      ds = paces + ' paces' + (S.lit ? ' \u00b7 ' + S.lit + ' lit' : '');
    }else{ nm = S.dir > 0 ? 'The far shore' : 'The home shore'; ds = S.lit ? S.lit + ' lit' : ''; }
    var sh = (S.dir > 0 ? 'Far shore ' : 'Home shore ') + shoreP.toLocaleString();

    // hints
    if(S.mode === 'aim'){
      if(time - S.noneT < 3.5) setHint('Flick upward and let go while your finger is moving.');
      else if(time - S.sankT < 4.5) setHint('That one sank. Try a faster, lower flick with a curl at the end.');
      else if(!hopOn && S.lastSkips > 0 && time - S.skipT < 4.5) setHint(S.lastSkips + (S.lastSkips === 1 ? ' skip' : ' skips'));
      else if(nearIsland()) setHint(nearIsland().coast ? 'Tap to step ashore' : nearIsland().boat ? 'Tap to step aboard' : 'Tap to step onto the island');
      else if(S.throws === 0 || time - S.aimSince > 6) setHint(AIM_HINT);
      else if(hintText.indexOf('Tap to step') >= 0 || hintText.indexOf(' skip') >= 0) setHint('');
      else if(hintText.indexOf('sank') >= 0 || hintText.indexOf('Flick upward') >= 0) setHint('');
    }else if(S.mode === 'stroll'){ setHint(S.arrived);
    }else if(S.mode === 'walk'){
      if(next && !S.hop && next.gap > MAXHOP && S.skims < 2) setHint('A long one. Tap to skim across.');
      else if(S.hops < 3) setHint('Tap to hop. A slower, gentler press glides.');
      else if(S.graces < 3 && S.hops < 14) setHint('Let go as the ring closes for the softest landing');
      else setHint('');
    }else setHint('');

    var cueC = '';
    if(started){
      var NIc = S.mode === 'aim' ? nearIsland() : null;
      if(S.mode === 'aim' && !NIc && !(ptr && ptr.grab) && (S.throws === 0 ? time - startT > 1.2 : time - S.aimSince > 9)) cueC = 'flick';
      else if(S.mode === 'walk' && !S.hop && S.hops < 3 && time - S.landT > 2.2) cueC = 'tap';
      else if(NIc && time - S.aimSince > 4) cueC = 'tap';
    }
    if(cueC !== cueNow){ cueNow = cueC; cueEl.className = 'cue' + (cueC ? ' ' + cueC : ''); }
  }

  var last = 0, dpr = Math.min(window.devicePixelRatio || 1, 1.5), perfT = 0, perfN = 0, saveT = 0;
  function frame(now){
    var t = now / 1000, dt = Math.min(0.05, t - last); last = t;
    if(dt > 0 && !document.hidden){
      time += dt; update(dt); renderer.render(scene, camera);
      perfT += dt; perfN++;
      if(perfN >= 120){
        if(perfT / perfN > 0.03 && dpr > 1){ dpr = Math.max(1, dpr - 0.25); renderer.setPixelRatio(dpr); resize(); }
        perfT = 0; perfN = 0;
      }
      saveT += dt; if(saveT > 5){ saveT = 0; if(started && !noSave) saveGame(); }
    }
    requestAnimationFrame(frame);
  }
  palette(S.dayT); sunAt(S.dayT); update(0.0001); renderer.render(scene, camera);
  requestAnimationFrame(function(now){ last = now / 1000; requestAnimationFrame(frame); });

  var hot = window.claude && window.claude.hot;
  if(hot && hot.snapshot){ try{ hot.snapshot(saveState); }catch(e){} }
}

var hot = window.claude && window.claude.hot;
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
